name: 编译 京东云雅典娜 AX6600 专属最新 iStoreOS 固件

on:
  workflow_dispatch:
    inputs:
      lan_ip:
        description: '默认 LAN 口 IP 地址'
        required: true
        default: '192.168.1.1'
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 检出编译配置库
        uses: actions/checkout@v4

      - name: 2. 准备 Linux 编译依赖环境与释放磁盘空间
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /etc/apt/sources.list.d/*
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison gawk gettext git libncurses5-dev libssl-dev python3-distutils python3-pyelftools rsync unzip zlib1g-dev squashfs-tools device-tree-compiler swig python3-dev python3-setuptools
          sudo -E apt-get -qq clean

      - name: 3. 拉取 iStoreOS 官方最新源码 (支持 IPQ60xx / 雅典娜 AX6600)
        run: |
          git clone --depth 1 https://github.com/istoreos/istoreos.git -b main openwrt || git clone --depth 1 https://github.com/istoreos/istoreos.git -b istoreos-24.12 openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 4. 配置京东云雅典娜 AX6600 专属初始化配置与默认 IP
        run: |
          cd openwrt
          mkdir -p files/etc/uci-defaults/
          LAN_IP="${{ github.event.inputs.lan_ip }}"
          [ -z "$LAN_IP" ] && LAN_IP="192.168.1.1"
          
          echo "#!/bin/sh" > files/etc/uci-defaults/99-custom-ax6600
          echo "uci set network.lan.ipaddr='${LAN_IP}'" >> files/etc/uci-defaults/99-custom-ax6600
          echo "uci set system.@system[0].timezone='CST-8'" >> files/etc/uci-defaults/99-custom-ax6600
          echo "uci set system.@system[0].zonename='Asia/Shanghai'" >> files/etc/uci-defaults/99-custom-ax6600
          echo "uci commit network" >> files/etc/uci-defaults/99-custom-ax6600
          echo "uci commit system" >> files/etc/uci-defaults/99-custom-ax6600
          echo "exit 0" >> files/etc/uci-defaults/99-custom-ax6600
          chmod +x files/etc/uci-defaults/99-custom-ax6600

      - name: 5. 集成核心第三方应用 (OpenClash, Docker, Samba4, iStore 商店)
        run: |
          cd openwrt
          rm -rf /tmp/openclash
          for i in 1 2 3 4 5; do
            git clone --depth 1 -b master https://github.com/vernesong/OpenClash.git /tmp/openclash && break || sleep 3
          done
          if [ -d "/tmp/openclash/luci-app-openclash" ]; then
            cp -r /tmp/openclash/luci-app-openclash package/luci-app-openclash
            rm -rf /tmp/openclash
          fi
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 6. 生成京东云雅典娜 AX6600 专属 .config 与依赖包下载
        run: |
          cd openwrt
          # 自动匹配 qualcommax / ipq60xx 目标平台下的 jdcloud_ax6600
          echo "CONFIG_TARGET_qualcommax=y" > .config
          echo "CONFIG_TARGET_qualcommax_ipq60xx=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_ax6600=y" >> .config
          
          # 核心硬件与无线驱动
          echo "CONFIG_PACKAGE_kmod-ath11k=y" >> .config
          echo "CONFIG_PACKAGE_kmod-ath11k-pci=y" >> .config
          echo "CONFIG_PACKAGE_ath11k-firmware-ipq6018=y" >> .config
          echo "CONFIG_PACKAGE_ath11k-firmware-qcn9074=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb3=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-storage=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-storage-uas=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-exfat=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-ntfs3=y" >> .config
          
          # iStore 商店与核心 UI
          echo "CONFIG_PACKAGE_luci-app-store=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-quickstart=y" >> .config
          
          # 核心网络与应用组件
          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
          echo "CONFIG_PACKAGE_dnsmasq_full_dhcpv6=y" >> .config
          echo "CONFIG_PACKAGE_dnsmasq_full_ipset=y" >> .config
          echo "CONFIG_PACKAGE_dnsmasq_full_nftset=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-dockerman=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-samba4=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-diskman=y" >> .config
          
          make defconfig
          sed -i 's/CONFIG_PACKAGE_dnsmasq=y/# CONFIG_PACKAGE_dnsmasq is not set/' .config
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: 7. 执行并行编译生成雅典娜 AX6600 固件
        run: |
          cd openwrt
          export FORCE_UNSAFE_CONFIGURE=1
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s

      - name: 8. 上传京东云雅典娜 AX6600 Release 固件产物
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-JDCloud-AX6600-Firmware
          path: |
            openwrt/bin/targets/qualcommax/ipq60xx/*factory.bin
            openwrt/bin/targets/qualcommax/ipq60xx/*sysupgrade.bin
            openwrt/bin/targets/ipq60xx/generic/*factory.bin
            openwrt/bin/targets/ipq60xx/generic/*sysupgrade.bin
